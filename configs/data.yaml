project:
  name: pneumonia-xray
  task: binary_classification
  prediction_level: image

dataset:
  name: kermany_pediatric_chest_xray
  source: kaggle
  kaggle_slug: paultimothymooney/chest-xray-pneumonia
  root_env: XRAY_DATA_ROOT
  population: pediatric_age_1_to_5

labels:
  normal: 0
  pneumonia: 1
  positive_class: pneumonia

audit_metadata:
  preserve_pneumonia_subtype: true
  subtype_values:
    - normal
    - bacterial
    - viral
    - unknown

image:
  size: 224
  source_channels: 1
  model_channels: 3
  preserve_aspect_ratio: true
  padding: true

split:
  strategy: patient_level_with_duplicate_group_fallback
  seed: 42
  internal_validation_fraction: 0.15
  development_sources:
    - provided_train
    - provided_val
  preferred_final_test_source: provided_test_after_audit
  rebuild_all_if_test_overlap: true
  rebuild_ratios:
    train: 0.70
    validation: 0.15
    test: 0.15
  final_test_locked: true
  version: split_v1

manifests:
  train: data/manifests/train.csv
  validation: data/manifests/validation.csv
  test: data/manifests/test.csv

prediction:
  level: image

evaluation:
  primary_metric: macro_f1
  clinical_metric: pneumonia_sensitivity
  additional_metrics:
    - specificity
    - roc_auc
    - pr_auc
    - confusion_matrix
