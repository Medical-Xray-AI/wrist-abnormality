experiment:
  name: baseline_cnn
  seed: 42

data_config: configs/data.yaml

model:
  name: small_cnn
  pretrained: false
  output_units: 1

training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  loss: weighted_bce_with_logits
  mixed_precision: true

scheduler:
  name: reduce_lr_on_plateau
  monitor: validation_macro_f1
  mode: max
  patience: 2

early_stopping:
  monitor: validation_macro_f1
  mode: max
  patience: 5

augmentation:
  horizontal_flip_probability: 0.5
  rotation_degrees: 7

checkpoint:
  save_best_only: true
  monitor: validation_macro_f1